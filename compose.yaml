services:
  mongodb:
    image: mongo:7.0
    container_name: campaign-mongodb
    environment:
      MONGO_INITDB_DATABASE: campaign
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "secret", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: campaign-api
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:secret@mongodb:27017/campaign?authSource=admin
    ports:
      - "8080:8080"

volumes:
  mongo-data:
